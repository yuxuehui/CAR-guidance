name: "exp3_dynamic_pcgrad"
description: "实验3：动态障碍物Guidance（PCGrad梯度手术，Yu et al. 2020）"

model:
  checkpoint_path: "checkpoints/checkpoint_epoch_20.pth"

guidance:
  type: "dynamic"
  path_offset: 0.5
  repulsion_strength: 1.0
  repulsion_radius: 1.0
  energy_scales: [-2.0, -2.0]
  use_gcov_optimization: false
  combine_method: "pcgrad"
  seed: 42

inference:
  num_steps: 20
  dt: 0.05

evaluation:
  goal_tolerance: 0.1
  collision_margin: 0.0
  wall_size: 1.0

output_dir: "experiments/outputs/exp3_dynamic_pcgrad"
