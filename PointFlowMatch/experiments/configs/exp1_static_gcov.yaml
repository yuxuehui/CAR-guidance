experiment_name: "exp1_static_gcov"

model:
  ckpt_path: "maniskill_train_pcd_from_three_cameras_more_gripper/ep1500-ba160500"

data:
  demos_path: "experiments/data/success_demos/success_demos.json"
  num_test_episodes: 10
  max_steps: 100
  num_actions_per_step: 32

guidance:
  type: "gcov"
  num_energy_centers: 2
  energy_scales: [-0.5, -0.5]
  sigma: 0.2
  max_guidance: null
  seed: 42
  enable_dynamic_energy_field: true

  train_online: true
  online_train_steps: 1
  online_batch_size: 64
  online_lr: 1e-3
  num_ode_steps: 20

  conflict_threshold: 0.15
  conflict_temperature: 0.1

  online_loss_type: "gradient"
  energy_temperature: 1.0
  policy_temperature: 1.0

  obstacle_reward_weight: 1.0
  goal_reward_weight: 10.0

  learned_correction_scale: 1.0

  save_visualization_data: true

  record_guidance_details: true

  residual_unet_channels: 64
  residual_unet_down_dims: [256, 512, 1024]

evaluation:
  metrics:
    - success_rate
    - average_jerk
    - min_obstacle_distance
  save_trajectories: true
  save_videos: true
  visualize_trajectory: true
  visualize: false
  video_resolution: [1920, 1080]
  video_output_dir: null

output_dir: "experiments/outputs/exp1_static_gcov"

debug:
  disable_guidance_after_first_round: True
  debug_training: true
  debug_learned_correction: true
